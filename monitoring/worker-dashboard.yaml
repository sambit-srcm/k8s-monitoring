apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-dashboard
  namespace: queue-system
  labels:
    grafana_dashboard: "1"
data:
  worker.json: |
    {
      "uid": "queue-worker",
      "title": "Queue worker",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Jobs completed",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (type) (rate(jobs_processed_total[1m]))",
              "legendFormat": "{{type}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Job errors",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (type) (rate(job_errors_total[1m]))",
              "legendFormat": "{{type}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Job duration p95",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, type) (rate(job_processing_time_seconds_bucket[1m])))",
              "legendFormat": "{{type}}"
            }
          ]
        }
      ]
    }
