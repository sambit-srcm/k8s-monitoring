apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: queue-system
spec:
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: queue-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: METRICS_PORT, value: "9100" }
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 9100 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 9100 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: queue-system
  labels: { app: worker }
spec:
  selector: { app: worker }
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
