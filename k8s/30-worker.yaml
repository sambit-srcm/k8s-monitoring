apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: queue-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: queue-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: METRICS_PORT, value: "9100" }
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 9100 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 9100 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: queue-system
  labels: { app: worker }
spec:
  selector: { app: worker }
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
