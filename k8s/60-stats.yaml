apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
  namespace: queue-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: stats }
  template:
    metadata:
      labels: { app: stats }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: stats
          image: queue-stats:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: PORT, value: "3100" }
          ports:
            - name: metrics
              containerPort: 3100
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3100 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3100 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: stats
  namespace: queue-system
  labels: { app: stats }
spec:
  type: ClusterIP
  selector: { app: stats }
  ports:
    - name: metrics
      port: 3100
      targetPort: metrics
